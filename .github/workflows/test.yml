name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A whole run takes about 3 minutes. Without a limit a hung download
    # sits for GitHub's default 6 hours (2026-10-07: 50 minutes stuck on
    # the browser install before anyone noticed).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: VITE_CONVEX_URL=https://courteous-rabbit-750.convex.cloud npm run build

      - name: Install Playwright browsers
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: E2E tests (playwright)
        run: npm run test:e2e
