name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A whole run takes about 3 minutes. Without a limit a hung download
    # sits for GitHub's default 6 hours (2026-10-07: 50 minutes stuck on
    # the browser install before anyone noticed).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: VITE_CONVEX_URL=https://courteous-rabbit-750.convex.cloud npm run build

      - name: Install Playwright browsers
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: E2E tests (playwright)
        run: npm run test:e2e

  # Production Convex (courteous-rabbit-750) used to be deployed by hand,
  # and it went wrong: deploys from a stale checkout, merges that shipped a
  # frontend calling functions prod didn't have. This deploys it on every
  # push to main, right after the unit tests pass. It doesn't wait for the
  # browser tests, so the backend lands about a minute after Cloudflare
  # ships the frontend instead of four.
  #
  # Needs the repository secret CONVEX_DEPLOY_KEY (Convex dashboard ›
  # Production › Settings › Deploy key). Without it the job says so and
  # passes, so nothing breaks before the key is added.
  deploy-convex:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deploy at a time, newest wins: two quick merges never race.
    concurrency:
      group: deploy-convex-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: app
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Check for the deploy key
        id: key
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::warning::CONVEX_DEPLOY_KEY isn't set, so production Convex was not deployed."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: npm install

      - name: Unit tests (vitest)
        if: steps.key.outputs.present == 'true'
        run: npm test

      - name: Deploy Convex to production
        if: steps.key.outputs.present == 'true'
        run: npx convex deploy
