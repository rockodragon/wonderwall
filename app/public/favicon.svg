  <rect x="18" y="3" width="12" height="42" rx="6" fill="#f7f7f4" transform="rotate(-22 24 24)"/>
  <rect x="18" y="3" width="12" height="42" rx="6" fill="#d7f25a" transform="rotate(22 24 24)"/>
</svg>
