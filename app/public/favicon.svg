<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- The Exchange mark: two bars crossing — give (paper) meets receive (citron). -->
  <rect x="0" y="0" width="48" height="48" fill="#121212"/>
  <rect x="17" y="4" width="14" height="40" rx="7" fill="#f7f7f4" transform="rotate(-32 24 24)"/>
  <rect x="17" y="4" width="14" height="40" rx="7" fill="#d7f25a" transform="rotate(32 24 24)"/>
</svg>
