<!doctype html>
<!-- Source for public/og-image.png (1200x630). The brand fonts are the
     vendored woff2 files in public/about/fonts, so this renders correctly
     offline — no Google Fonts fetch.

     Regenerate after editing:
       node scripts/render-og.mjs

     Keep this and the meta tags in app/routes/home.tsx saying the same
     thing; they were allowed to drift once already (the image still said
     TheCrossBoard long after the copy moved to creatives.exchange). --><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'JetBrains Mono';src:url('../public/about/fonts/jetbrains-500.woff2') format('woff2');font-weight:500;font-display:block}
@font-face{font-family:'Bricolage Grotesque';src:url('../public/about/fonts/bricolage-600.woff2') format('woff2');font-weight:600;font-display:block}
@font-face{font-family:'Archivo';src:url('../public/about/fonts/archivo-400.woff2') format('woff2');font-weight:400;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
body{
  background:#121212;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:72px 80px;
  -webkit-font-smoothing:antialiased;
}
.lockup{display:flex;align-items:center;gap:18px}
.wm{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:26px;
    letter-spacing:.24em;text-transform:uppercase;color:#f7f7f4}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;
   font-size:82px;line-height:1.03;letter-spacing:-.03em;color:#f7f7f4;
   max-width:20ch}
.sub{font-family:'Archivo',sans-serif;font-size:28px;line-height:1.5;
     color:#c6c6be;max-width:52ch;margin-top:28px}
.foot{display:flex;align-items:center;justify-content:space-between}
.tag{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:17px;
     letter-spacing:.18em;text-transform:uppercase;color:#94948c}
.tag b{color:#d7f25a;font-weight:500}
.url{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:17px;
     letter-spacing:.14em;text-transform:uppercase;color:#94948c}
</style></head><body>
  <div class="lockup">
    <svg viewBox="0 0 48 48" width="46" height="46" fill="none">
      <rect x="20" y="3" width="8" height="42" rx="4" fill="#f7f7f4" transform="rotate(-18 24 24)"/>
      <rect x="20" y="3" width="8" height="42" rx="4" fill="#d7f25a" transform="rotate(18 24 24)"/>
    </svg>
    <span class="wm">creatives.exchange</span>
  </div>
  <div>
    <h1>Show your craft. Find paid work.</h1>
    <p class="sub">Portfolios, projects, events, and paid work — and half of every membership funds another creative's project.</p>
  </div>
  <div class="foot">
    <span class="tag">Give<b>.</b> Receive<b>.</b> Grow</span>
    <span class="url">creatives.exchange</span>
  </div>
</body></html>
