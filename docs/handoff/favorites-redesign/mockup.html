<title>Shortlist Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the desk (dotted dark surface, 48px left edge). The page reads top-down:
   Needs you, then four area tiles in priority order (Work, Projects, Events, People),
   then rows grouped by status inside an area, then the opened card.
   The palette owns the lower-left corner. One dark theme on purpose: the desk is always dark.
   Blue (--note) is the mockup's annotation layer and is not part of the product. */
:root{
  color-scheme: dark;
  --surface:#151515; --page:#121212; --panel:#181818; --dot:#262626;
  --line:#2e2e2e; --line-strong:#333333; --hover:#2a2a2a;
  --text:#F4F4F2; --text-soft:#D6D6D6; --text-quiet:#B3B3B3; --muted:#ACACA4;
  --accent:#FFE066; --accent-hover:#FFEA94; --accent-ink:#121212; --accent-08:rgba(255,224,102,.08);
  --paper:#EDE3B4; --paper-ink:#1d1b12;
  --note:#7CC4FF; --note-08:rgba(124,196,255,.08); --note-line:rgba(124,196,255,.35); --note-ground:#0f1317;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
  --side: 48px;
}
@media (max-width: 640px){ :root{ --side: 20px; } }

html,body{height:100%;overflow:hidden}
body{background:var(--page);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{transition:none!important;animation:none!important} }

/* ——— Mockup bar (annotation layer) ——— */
.mockbar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--note-ground);border-bottom:1px dashed var(--note-line);overflow-x:auto;scrollbar-width:none}
.mockbar::-webkit-scrollbar{display:none}
.mock-label{font:500 12px var(--mono);letter-spacing:.2em;color:var(--note);white-space:nowrap;margin-right:4px}
.scene,.notes-toggle{flex:none;height:30px;padding:0 12px;border-radius:999px;border:1px solid #29394a;background:transparent;color:#cfe3f5;font-size:13px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.scene .k{font:12px var(--mono);color:#7d98b0}
.scene[aria-pressed="true"],.notes-toggle[aria-pressed="true"]{border-color:var(--note);background:var(--note-08);color:var(--note)}
.scene[aria-pressed="true"] .k{color:var(--note)}
.scene:hover,.notes-toggle:hover{border-color:#4f7193}
.mock-spacer{flex:1;min-width:8px}

/* ——— Stage + desk ——— */
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
.desk{position:absolute;inset:0;overflow-y:auto;background-color:var(--surface);background-image:radial-gradient(var(--dot) 1px, transparent 1px);background-size:24px 24px;background-attachment:local}
.desk-inner{padding-bottom:160px;min-height:100%}

.head{padding:44px var(--side) 18px;display:flex;flex-direction:column;gap:10px}
.mono-label{margin:0;font:400 12px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.title{margin:0;font-size:30px;font-weight:500;letter-spacing:-.02em;line-height:1.2;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;text-wrap:balance}
.title .count{font-size:16px;font-weight:400;letter-spacing:0;color:var(--muted)}
.crumb{background:none;border:0;padding:0;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--muted)}
.crumb:hover{color:var(--accent)}

.chiprow{position:sticky;top:0;z-index:15;display:flex;gap:8px;flex-wrap:wrap;padding:10px var(--side) 14px;border-bottom:1px solid transparent;transition:background-color .2s ease,border-color .2s ease}
.chiprow.stuck{background:rgba(21,21,21,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom-color:var(--line)}
.chip{height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--text-soft);font-size:13.5px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.chip .n{font:12px var(--mono);color:var(--muted)}
.chip:hover{border-color:#555}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-08);color:var(--accent)}
.chip[aria-pressed="true"] .n{color:var(--accent)}
.chip .hotdot{width:7px;height:7px;border-radius:50%;background:var(--accent)}

.section{padding:0 var(--side);max-width:calc(920px + 2 * var(--side))}
.kicker{margin:0 0 10px;font:400 12px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kicker.hot{color:var(--accent)}
.kicker .sub{color:var(--muted);letter-spacing:.12em}
.group{margin-top:32px}
.month{margin:18px 0 6px;font:400 12px var(--mono);letter-spacing:.2em;color:var(--text-quiet)}

/* ——— Rows (level 2) ——— */
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) 128px 200px 88px;align-items:center;gap:16px;min-height:64px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background-color .12s ease}
.row:hover{background:rgba(255,255,255,.035)}
.row:hover .row-title{color:var(--accent)}
.row.hot::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--accent)}
.row.past .row-title,.row.past .row-sub{color:#8a8a84}
.row-text{min-width:0}
.row-title{font-size:15px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .12s ease}
.row-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub2{display:none}
.row-meta{font:12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-quiet);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-status{font-size:13px;color:var(--text-soft);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.hot .row-status{font:12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.row-act{display:flex;justify-content:flex-end}
.btn-outline{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:transparent;color:var(--text);font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width: 860px){
  .row{grid-template-columns:44px minmax(0,1fr) auto}
  .row-meta,.row-status{display:none}
  .row-sub2{display:block;font-size:13px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row.hot .row-sub2{font:12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
}

.thumb{width:44px;height:44px;border-radius:4px;flex:none;background-size:cover}
.thumb.date{background:#1d1d1d;border:1px solid var(--line-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.thumb.date .m{font:12px var(--mono);letter-spacing:.1em;color:var(--muted)}
.thumb.date .d{font-size:17px;font-weight:500;color:var(--text);margin-top:4px;font-variant-numeric:tabular-nums}
.row.hot .thumb.date{border-color:rgba(255,224,102,.5)}
.thumb.face{border-radius:50%;display:flex;align-items:center;justify-content:center;font:500 13px var(--mono);color:var(--paper-ink)}

.more{margin-top:12px;display:flex;gap:18px;flex-wrap:wrap}
.linkish{background:none;border:0;padding:4px 0;cursor:pointer;color:var(--text-soft);font-size:14px}
.linkish:hover{color:var(--accent)}
.linkish.quiet{color:var(--muted)}
.empty-line{padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-size:15px;display:flex;gap:16px;flex-wrap:wrap;align-items:baseline}

/* ——— Tiles (level 1) ——— */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(200px,264px));gap:24px;padding:0 var(--side)}
@media (max-width: 1180px){ .tiles{grid-template-columns:repeat(2,minmax(0,264px))} }
@media (max-width: 520px){ .tiles{grid-template-columns:minmax(0,1fr)} }
.tile{position:relative;height:224px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:20px 20px 18px;display:flex;flex-direction:column;text-align:left;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .32s var(--ease),box-shadow .32s var(--ease),border-color .2s ease}
.tile:hover{transform:translateY(-8px);box-shadow:0 40px 80px rgba(0,0,0,.6);border-color:#3c3c3c}
.tile-top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:18px}
.tile-kicker{font:400 12px var(--mono);letter-spacing:.2em;color:var(--muted)}
.tile-flag{font:12px var(--mono);letter-spacing:.1em;color:var(--accent);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tile-flag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.tile-count{font-size:56px;font-weight:500;letter-spacing:-.035em;line-height:1;margin-top:16px;font-variant-numeric:tabular-nums}
.tile-break{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.45}
.tile-next{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.empty{background:transparent;border-style:dashed;box-shadow:none;cursor:default}
.tile.empty:hover{transform:none;box-shadow:none;border-color:var(--line)}
.tile.empty .tile-none{margin-top:auto;color:var(--muted);font-size:15px}
.faces{display:flex;margin-top:16px;height:56px;align-items:center}
.faces span{width:34px;height:34px;border-radius:50%;margin-left:-8px;display:flex;align-items:center;justify-content:center;font:500 12px var(--mono);color:var(--paper-ink);box-shadow:0 0 0 2px var(--panel)}
.faces span:first-child{margin-left:0}
.faces .n{margin-left:12px;font-size:56px;font-weight:500;letter-spacing:-.035em;line-height:1;color:var(--text);box-shadow:none;width:auto;height:auto;font-family:var(--sans)}

.welcome{margin:24px var(--side) 0;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:36px 36px 30px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.welcome h2{margin:0 0 10px;font-size:26px;font-weight:500;letter-spacing:-.02em;text-wrap:balance}
.welcome p{margin:0;color:var(--text-soft);max-width:46ch}
.welcome ul{list-style:none;margin:22px 0 0;padding:16px 0 0;border-top:1px solid var(--line);display:grid;gap:4px}

/* ——— Opened card (level 3) ——— */
.dim{position:absolute;inset:0;background:rgba(10,10,10,.6);z-index:20;opacity:0;pointer-events:none;transition:opacity .4s ease}
.dim.on{opacity:1;pointer-events:auto}
.card{position:absolute;inset:24px;z-index:30;border-radius:12px;overflow:hidden;display:flex;background:var(--panel);box-shadow:0 40px 120px rgba(0,0,0,.65);opacity:0;transform:translateY(24px) scale(.98);pointer-events:none;transition:opacity .4s var(--ease),transform .62s var(--ease)}
.card.on{opacity:1;transform:none;pointer-events:auto}
.card-face{flex:0 0 46%;position:relative;padding:56px;display:flex;flex-direction:column;justify-content:space-between;color:var(--text);overflow:hidden}
.card-face .scrim{position:absolute;inset:0;background:linear-gradient(to top, rgba(18,18,18,.94) 0%, rgba(18,18,18,.7) 34%, rgba(18,18,18,0) 64%),linear-gradient(to bottom, rgba(18,18,18,.5), transparent 30%)}
.card-face > *{position:relative}
.face-kicker{font:400 12px var(--mono);letter-spacing:.2em;text-transform:uppercase;opacity:.9}
.face-title{font-size:clamp(34px,4.4vw,64px);font-weight:500;line-height:1.02;letter-spacing:-.025em;text-wrap:balance;margin:0}
.face-foot{font-size:14px;opacity:.85;margin-top:12px}
.card-face.paper{background:var(--paper);color:var(--paper-ink)}
.card-face.paper .scrim{display:none}
.initials{font:500 clamp(80px,12vw,168px) var(--mono);letter-spacing:-.04em;line-height:1}
.card-panel{flex:1;min-width:0;padding:32px 56px 44px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;background:var(--panel)}
.panel-bar{display:flex;align-items:center;gap:12px}
.panel-meta{flex:1;min-width:0;font:400 12px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.stepper{display:flex;align-items:center;gap:8px;font:12px var(--mono);letter-spacing:.14em;color:var(--muted);white-space:nowrap}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-strong);background:transparent;color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.round:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.round:disabled{opacity:.35;cursor:default}
.status-chip{align-self:flex-start;font:400 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(255,224,102,.35);background:var(--accent-08);border-radius:6px;padding:7px 10px;margin-top:6px}
.panel-title{margin:0;font-size:44px;font-weight:500;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.panel-host{margin:-6px 0 0;font-size:15px;color:var(--muted)}
.panel-desc{margin:0;font-size:18px;line-height:1.65;color:var(--text-soft);max-width:46ch}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,220px));gap:14px 32px;margin:4px 0 0;padding:18px 0 0;border-top:1px solid var(--line)}
.facts dt{font:400 12px var(--mono);letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.facts dd{margin:4px 0 0;font-size:15px;color:var(--text)}
.actions{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:auto;padding-top:14px}
.btn-solid{height:52px;padding:0 28px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:600;cursor:pointer}
.btn-solid:hover:not(:disabled){background:var(--accent-hover)}
.btn-solid:disabled{background:#3a3626;color:#d8cf9d;cursor:default}
.btn-text{background:none;border:0;padding:6px 0;color:var(--text-soft);font-size:15px;cursor:pointer}
.btn-text:hover{color:var(--accent)}
.aside{font-size:14px;color:var(--muted)}
@media (max-width: 860px){
  .card{inset:10px;flex-direction:column}
  .card-face{flex:0 0 190px;padding:24px}
  .card-panel{padding:20px 22px 28px}
  .panel-title{font-size:32px}
  .facts{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}

/* ——— Palette ——— */
.palette{position:absolute;left:0;bottom:0;width:280px;height:280px;z-index:40;pointer-events:none}
.palette.open{pointer-events:auto}
.pal-main{position:absolute;left:28px;bottom:28px;width:56px;height:56px;border-radius:50%;border:1px solid var(--accent);background:rgba(255,224,102,.08);box-shadow:0 0 0 6px rgba(255,224,102,.05);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;z-index:2}
.pal-main .chipct{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:500 12px var(--mono);display:flex;align-items:center;justify-content:center}
.pal-tool{position:absolute;left:34px;bottom:34px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line-strong);background:rgba(24,24,24,.92);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transform:translate(0,0) scale(.4);pointer-events:none;transition:transform .34s var(--ease),opacity .34s var(--ease),background-color .15s ease,border-color .15s ease,scale .15s ease}
.palette.open .pal-tool{opacity:1;transform:translate(var(--x),var(--y)) scale(1);pointer-events:auto}
.pal-tool:hover,.pal-tool.hover{background:var(--hover);scale:1.12}
.pal-tool.active{border-color:var(--accent);color:var(--accent)}
.pal-tool .initials-sm{font:500 13px var(--mono)}
.pal-dot{position:absolute;top:0;right:0;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.pal-stack{position:absolute;min-width:236px;padding:8px;border-radius:14px;background:rgba(26,26,26,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.55);opacity:0;transform:translateX(-8px);pointer-events:none;transition:opacity .24s ease,transform .24s var(--ease);z-index:3}
.pal-stack.on{opacity:1;transform:none;pointer-events:auto}
.pal-stack::before{content:"";position:absolute;left:-28px;top:0;bottom:0;width:28px}
.pal-head{padding:8px 12px 6px;font:400 12px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.pal-item{display:flex;width:100%;align-items:center;justify-content:space-between;gap:16px;padding:10px 12px;border-radius:8px;border:0;background:transparent;color:var(--text);font-size:15px;text-align:left;cursor:pointer;white-space:nowrap}
.pal-item:hover,.pal-item:focus-visible{background:var(--hover);color:var(--accent)}
.pal-item .trail{font:13.5px var(--mono);color:var(--muted)}
.pal-item .trail.hot{color:var(--accent)}
.pal-item.gone{color:#77777a;text-decoration:line-through;cursor:default}
.pal-item.gone:hover{background:transparent;color:#77777a}

/* ——— Toast ——— */
.toast{position:absolute;left:50%;bottom:28px;z-index:70;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#232323;border:1px solid var(--line-strong);color:var(--text);padding:12px 18px;border-radius:10px;font-size:14px;box-shadow:0 20px 50px rgba(0,0,0,.5);transition:opacity .25s ease,transform .3s var(--ease);max-width:min(520px,calc(100% - 32px))}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ——— Notes drawer (annotation layer) ——— */
.notes{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);z-index:60;background:var(--note-ground);border-left:1px dashed var(--note-line);overflow-y:auto;padding:26px 26px 60px;color:#cbd6df;font-size:14px;line-height:1.6;transform:translateX(102%);transition:transform .32s var(--ease)}
.notes.on{transform:none}
.notes h2{margin:0 0 4px;font-size:20px;font-weight:500;color:#eef5fb;letter-spacing:-.01em}
.notes h3{margin:26px 0 8px;font:500 12px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--note)}
.notes p{margin:0 0 10px}
.notes ul,.notes ol{margin:0 0 10px;padding-left:18px}
.notes li{margin:0 0 6px}
.notes strong{color:#eef5fb;font-weight:500}
.notes code{font:12.5px var(--mono);color:#e7f1fa;background:rgba(124,196,255,.1);padding:1px 5px;border-radius:4px}
.notes .close-notes{position:absolute;top:18px;right:18px}
.notes .round{border-color:#29394a;color:#cfe3f5}
.newtag{display:none;flex:none;font:500 12px var(--mono);letter-spacing:.12em;color:var(--note);border:1px solid var(--note-line);background:var(--note-08);border-radius:4px;padding:1px 6px;line-height:1.5;text-transform:uppercase;white-space:nowrap}
body.notes-on .newtag{display:inline-flex}
.newtag.float{position:absolute;top:-10px;right:10px}
</style>

<div class="mockbar" role="toolbar" aria-label="Mockup frames">
  <span class="mock-label">MOCKUP</span>
  <button class="scene" data-scene="overview"><span class="k">1</span>Overview</button>
  <button class="scene" data-scene="work"><span class="k">2</span>Work open</button>
  <button class="scene" data-scene="invite"><span class="k">3</span>An invite</button>
  <button class="scene" data-scene="palette"><span class="k">4</span>Palette</button>
  <button class="scene" data-scene="events40"><span class="k">5</span>40 saved events</button>
  <button class="scene" data-scene="sparse"><span class="k">6</span>Two follows</button>
  <button class="scene" data-scene="new"><span class="k">7</span>New member</button>
  <span class="mock-spacer"></span>
  <button class="notes-toggle" id="notesToggle" aria-pressed="false">Design notes</button>
</div>

<div class="stage" id="stage">
  <div class="desk" id="desk"><div class="desk-inner" id="deskInner"></div></div>
  <div class="dim" id="dim"></div>
  <div class="card" id="card" role="dialog" aria-modal="true" aria-label="Opened item"></div>
  <nav class="palette" id="palette" aria-label="Palette"></nav>
  <aside class="notes" id="notes" aria-label="Design notes"></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
"use strict";

// ——— Time ———
var TODAY = new Date(2026, 9, 2); // Fri Oct 2, 2026
var MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
var MONTH = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var DOWL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function D(m, d, y){ return new Date(y || 2026, m - 1, d); }
function days(d){ return Math.round((d - TODAY) / 864e5); }
function short(d){ return MONTH[d.getMonth()].slice(0,3) + " " + d.getDate(); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

];
function cover(t){
  var c = TONES[t % TONES.length];
  return "radial-gradient(circle at 70% 28%, " + c[2] + " 0 17%, transparent 18%), radial-gradient(ellipse at 18% 88%, " + c[1] + " 0 34%, transparent 35%), linear-gradient(160deg, " + c[1] + ", " + c[0] + " 72%)";
}
function faceTone(t){ return TONES[t % TONES.length][2]; }
function initialsOf(name){ return name.split(/\s+/).map(function(w){ return w[0]; }).join("").slice(0,2).toUpperCase(); }

function makeData(scenario){
  var data = { work:[], projects:[], events:[], people:[] };
  if (scenario === "typical" || scenario === "heavy"){
    data.work = work(); data.projects = projects(); data.people = people();
    data.events = scenario === "heavy" ? eventsHeavy() : eventsTypical();
  } else if (scenario === "sparse"){
    data.people = people().filter(function(p){ return p.name === "Mara Lin" || p.name === "Theo Okafor"; });
  }
  ["work","projects","events","people"].forEach(function(a){ data[a].forEach(function(i){ i.area = a; }); });
  return data;
}

};
var COLLAPSED = { closed:true, past:true };
function isLive(i){ return i.kind !== "closed" && i.kind !== "past"; }
function isSoon(i){ return i.area === "events" && i.kind === "going" && days(i.date) >= 0 && days(i.date) <= 7; }
function isDue(i){ return i.kind === "saved" && i.role && i.due && days(i.due) >= 0 && days(i.due) <= 7; }
function groupOf(i){
  if (i.area === "events") return isSoon(i) ? "week" : i.kind;
  if (i.kind === "invited" || isDue(i)) return "needs";
  return i.kind;
}
function needsList(data){
  var all = data.work.concat(data.projects);
  var inv = all.filter(function(i){ return i.kind === "invited"; });
  var soon = data.events.filter(isSoon).sort(function(a,b){ return a.date - b.date; });
  var due = all.filter(isDue).sort(function(a,b){ return a.due - b.due; });
  return inv.concat(soon, due);
}
function liveCount(data, area){ return data[area].filter(isLive).length; }
function areaNeeds(data, area){ return needsList(data).filter(function(i){ return i.area === area; }).length; }
function plural(n, one, many){ return n + " " + (n === 1 ? one : many); }

function breakdown(data, area){
  var c = {};
  data[area].filter(isLive).forEach(function(i){ c[i.kind] = (c[i.kind] || 0) + 1; });
  var parts = [];
  if (area === "work"){
    if (c.invited) parts.push(plural(c.invited, "invite", "invites"));
    if (c.applied) parts.push(c.applied + " applied");
    if (c.team) parts.push(c.team + " on the team");
    if (c.saved) parts.push(c.saved + " saved");
  } else if (area === "projects"){
    if (c.invited) parts.push(plural(c.invited, "invite", "invites"));
    if (c.asked) parts.push(c.asked + " asked to join");
    if (c.team) parts.push(c.team + " on the team");
    if (c.backing) parts.push(c.backing + " backing");
    if (c.saved) parts.push(c.saved + " saved");
  } else if (area === "events"){
    if (c.going) parts.push(c.going + " going");
    if (c.requested) parts.push(c.requested + " requested");
    if (c.saved) parts.push(c.saved + " saved");
  } else {
    var g = {};
    data.people.forEach(function(p){ g[p.interests[0]] = 1; });
    parts.push("Across " + plural(Object.keys(g).length, "interest", "interests"));
  }
  return parts.join(" · ");
}
function nextLine(data, area){
  var items = data[area];
  if (area === "work" || area === "projects"){
    var inv = items.filter(function(i){ return i.kind === "invited"; })[0];
    if (inv) return "Reply to " + inv.who + " · " + inv.title;
    var due = items.filter(function(i){ return i.kind === "saved" && i.due; }).sort(function(a,b){ return a.due - b.due; })[0];
    if (due) return "Next: " + due.title + ", fill by " + short(due.due);
    var ask = items.filter(function(i){ return i.kind === "asked" || i.kind === "applied"; })[0];
    if (ask) return "Waiting on " + ask.who + " · " + ask.project;
    var any = items.filter(isLive)[0];
    return any ? "Latest: " + (any.project || any.title) : "";
  }
  if (area === "events"){
    var g = items.filter(function(e){ return e.kind === "going" && days(e.date) >= 0; }).sort(function(a,b){ return a.date - b.date; })[0];
    if (g) return "Next: " + g.title + ", " + whenWord(g.date).toLowerCase();
    var s = items.filter(isLive).sort(function(a,b){ return a.date - b.date; })[0];
    return s ? "Soonest: " + s.title + ", " + short(s.date) : "";
  }
  var latest = items.slice().sort(function(a,b){ return b.since - a.since; })[0];
  return latest ? "Latest: " + latest.name + ", " + short(latest.since) : "";
}
function whenWord(d){
  var n = days(d);
  if (n === 0) return "Today";
  if (n === 1) return "Tomorrow";
  if (n > 1 && n < 7) return DOWL[d.getDay()];
  if (n >= 7 && n <= 13) return "Next " + DOWL[d.getDay()];
  return short(d);
}

function setPal(open, stack){
  var el = document.getElementById("palette"), wasOpen = el.classList.contains("open");

  if (open && !wasOpen){
    renderPalette();
    void el.offsetWidth; // draw the closed fan first, so it opens with motion
    el.classList.add("open");
  } else {
    el.classList.toggle("open", open);
    renderPalette();
  }
}
function bindPalette(){
  var el = document.getElementById("palette");
  el.addEventListener("pointerenter", function(e){ clearTimeout(pal.closeTimer); }, true);
  el.addEventListener("mouseover", function(e){
    clearTimeout(pal.closeTimer);
    if (e.target.closest("#palMain") && !pal.open) setPal(true, null);
    var t = e.target.closest("[data-tool]");
    if (t && pal.open && pal.stack !== t.dataset.tool){ pal.stack = t.dataset.tool; syncStacks(); }
  });
  el.addEventListener("mouseleave", function(){
    if (state.palettePinned) return;
    clearTimeout(pal.closeTimer);
    pal.closeTimer = setTimeout(function(){ setPal(false); }, 300);
  });
  el.addEventListener("focusin", function(e){
    if (e.target.id === "palMain" && !pal.open) { setPal(true, null); document.getElementById("palMain").focus(); }
    var t = e.target.closest("[data-tool]");
    if (t && pal.stack !== t.dataset.tool){ pal.stack = t.dataset.tool; syncStacks(); }
  });
  el.addEventListener("click", function(e){
    var main = e.target.closest("#palMain");
    if (main){ toast("The main button is the Desk: it resets the desk to everything. That's why the Desk tool can go."); return; }
    var t = e.target.closest("[data-tool]");

    }
  });
}
function syncStacks(){

}

  '<h3>Order</h3><p>Work, Projects, Events, People. Positions are fixed and never hidden, so people learn where things are. Work is anything that pays; volunteer roles sit under Projects.</p>' +
  '<h3>Three levels</h3><ol><li><strong>Overview.</strong> Needs you (up to 3), then four tiles with counts, a breakdown and one next step. Fits 1440×900 without scrolling.</li><li><strong>An area.</strong> Rows, not posters, grouped by status. Status, dates and pay are what you decide on, and rows put 10+ on a screen. Closed and past fold away.</li><li><strong>One item.</strong> The existing opened card, plus a status line, one action that follows the state, and ← → to step through the group.</li></ol>' +
  '<h3>Needs you</h3><ol><li>An invite waiting on your reply.</li><li>An event you\'re going to in the next 7 days.</li><li>A saved role that fills within 7 days.</li></ol><p>Nothing else counts. Notifications stay in Messages. Counts include live items only.</p>' +
  '<h3>Palette</h3><ul><li>Shortlist replaces the Desk tool, in the same arc slot. The main button already does what Desk did, and a 7th tool would overlap on the 150px arc.</li><li>New order: Today, People, Projects, Events, Shortlist, Profile.</li><li>"See my favorites" leaves the Events stack.</li><li>A yellow dot on Shortlist when something needs you. The number chip stays for messages.</li></ul>' +
  '<h3>Data gaps (tagged New)</h3><ul><li>Save a project or role: <code>favorites.targetType</code> gains "project" and "role", with branches in <code>getMyFavorites</code> (/events reads it too).</li><li>A my-requests query over <code>projectMembers.by_userId_status</code>: invited, applied, team, closed, with role, pay, fill-by and lead.</li><li>Going: <code>eventRsvps</code> needs a by-user index. Requested: <code>eventApplications.by_applicantId</code> exists.</li><li>A <code>role:&lt;id&gt;</code> opened-card kind, ← → stepping, and bulk "Remove past events".</li><li>Already there: follows, saved events, backing (<code>listMySupportGiven</code>).</li></ul>' +
  '<h3>Decided · Oct 2</h3><ol><li>The name is <strong>Shortlist</strong>, everywhere.</li><li>Shortlist takes the Desk tool\'s slot.</li><li>Only what the member did. No suggestions, AI or otherwise.</li><li><strong>Needs you leads Today too</strong>: the same rules from one function, up to 3 rows above Today\'s cards, then "N more on your Shortlist →". Hidden on Today when nothing needs you.</li></ol>' +
  '<h3>Still open</h3><ol><li>Paid roles under Work, volunteer roles under Projects. Right split?</li><li>Phones: same structure, tiles 2×2?</li></ol>' +
  '<h3>Frames</h3><p>Use the bar along the top. Everything is clickable: tiles, chips, rows, the card\'s buttons, ← → and Escape, and the palette in the lower left.</p>';
}

// ——— Toast ———
var toastTimer = 0;
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove("on"); }, 2600);
}

// ——— Render + navigation ———
function render(){
  lists = {};
  var inner = document.getElementById("deskInner");
  inner.innerHTML = state.area ? renderArea() : renderOverview();
  renderCard();
  renderPalette();
  document.body.classList.toggle("notes-on", state.notes);
  document.getElementById("notes").classList.toggle("on", state.notes);
  document.getElementById("palette").classList.toggle("open", pal.open);
  document.getElementById("notesToggle").setAttribute("aria-pressed", String(state.notes));
  syncScene();
  onScroll();
}
function currentScene(){
  if (state.palettePinned) return "palette";
  if (state.scenario === "empty") return "new";
  if (state.scenario === "sparse") return state.area || state.card ? "" : "sparse";
  if (state.scenario === "heavy") return state.area === "events" && !state.card ? "events40" : "";
  if (state.card) return state.card.id === "w-invite" && !state.area ? "invite" : "";
  if (state.area === "work") return "work";
  return state.area ? "" : "overview";
}
function syncScene(){
  var cur = currentScene();
  document.querySelectorAll(".scene").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.scene === cur)); });
}
function go(patch){
  var areaChanged = "area" in patch && patch.area !== state.area;
  for (var k in patch) state[k] = patch[k];
  if (areaChanged) state.expanded = {};
  render();
  if (areaChanged) document.getElementById("desk").scrollTop = 0;
}
var SCENES = {
  overview:{ scenario:"typical", area:null },
  work:{ scenario:"typical", area:"work" },
  invite:{ scenario:"typical", area:null, card:{ id:"w-invite", list:"needs" } },
  palette:{ scenario:"typical", area:null, palette:true },
  events40:{ scenario:"heavy", area:"events" },
  sparse:{ scenario:"sparse", area:null },
  "new":{ scenario:"empty", area:null }
};
function scene(name){
  if (!SCENES[name]) name = "overview";
  var s = SCENES[name];
  state.scenario = s.scenario; state.data = makeData(s.scenario);
  state.area = s.area; state.card = null; state.needsAll = false; state.expanded = {};
  state.palettePinned = !!s.palette;
  render();
  document.getElementById("desk").scrollTop = 0;
  if (s.card){ state.card = s.card; renderCard(); }
  if (s.palette){ setPal(true, "shortlist"); } else { setPal(false); }
  syncScene();
  try { history.replaceState(null, "", "#" + name); } catch (e) {}
}
function openCard(id, list){ state.card = { id:id, list:list }; renderCard(); }
function closeCard(){
  state.card = null; renderCard();
}
function step(dir){
  if (!state.card) return;
  var ids = lists[state.card.list] || [], idx = ids.indexOf(state.card.id) + dir;
  if (idx >= 0 && idx < ids.length){ state.card.id = ids[idx]; renderCard(); }
}
function mutate(kind, i){
  var name = i.title;
  if (kind === "accept"){ i.kind = "team"; i.status = "You're on the team"; i.d = Object.assign({}, i.d, { status:"You joined today · On the team", aside:"" }); toast("You're on the team for " + i.project + "."); }
  else if (kind === "decline"){ i.kind = "closed"; i.status = "You declined"; toast("Declined. " + i.who + " will see it."); }
  else if (kind === "withdraw"){ i.kind = "closed"; i.status = "Withdrawn"; toast("Request withdrawn."); }
  else if (kind === "apply"){ i.kind = "applied"; i.status = "Waiting on " + i.who + " · today"; i.d = Object.assign({}, i.d, { status:"You applied today · Waiting on " + i.who, aside:"Sent today" }); toast("In the app, Apply opens the request form. Marked as applied here."); }
  else if (kind === "going"){ i.kind = "going"; toast("You're going to " + name + "."); }
  else if (kind === "remove"){
    var arr = state.data[i.area]; arr.splice(arr.indexOf(i), 1);
    toast(i.area === "people" ? "Unfollowed " + name + "." : "Removed from your shortlist.");
  }
  state.card = null;
  render();
}

// ——— Events ———
function bind(){
  document.querySelector(".mockbar").addEventListener("click", function(e){
    var s = e.target.closest("[data-scene]"); if (s) scene(s.dataset.scene);
    if (e.target.closest("#notesToggle")){ state.notes = !state.notes; render(); if (state.palettePinned) setPal(true, "shortlist"); }
  });
  document.getElementById("stage").addEventListener("click", function(e){
    var el;
    if (e.target.closest("#palette")) {
      el = e.target.closest(".pal-item[data-area]");
      if (el){ state.palettePinned = false; setPal(false); go({ area: el.dataset.area || null, card:null }); return; }
      el = e.target.closest(".pal-item[data-toast]");
      if (el){ toast(el.dataset.toast); }
      return;
    }
    if ((el = e.target.closest("[data-notes-close]"))){ state.notes = false; render(); return; }
    if ((el = e.target.closest("[data-do]"))){ var it = findItem(state.card && state.card.id); if (it) mutate(el.dataset.do, it); return; }
    if ((el = e.target.closest("[data-toast]"))){ toast(el.dataset.toast); return; }
    if ((el = e.target.closest("[data-close]")) || e.target.id === "dim"){ closeCard(); return; }
    if ((el = e.target.closest("[data-step]"))){ step(Number(el.dataset.step)); return; }
    if ((el = e.target.closest("[data-act]"))){
      var row = el.closest("[data-open]"); openCard(el.dataset.id, row ? row.dataset.list : "needs"); return;
    }
    if ((el = e.target.closest("[data-needs-all]"))){ go({ needsAll: !state.needsAll }); return; }
    if ((el = e.target.closest("[data-expand]"))){ state.expanded[el.dataset.expand] = !state.expanded[el.dataset.expand]; render(); return; }
    if ((el = e.target.closest("[data-clear-past]"))){ state.data.events = state.data.events.filter(function(x){ return x.kind !== "past"; }); toast("Past events removed from your shortlist."); render(); return; }
    if ((el = e.target.closest("[data-area]"))){ go({ area: el.dataset.area || null, card:null }); return; }
    if ((el = e.target.closest("[data-open]"))){ openCard(el.dataset.open, el.dataset.list); return; }
    if (pal.open && !state.palettePinned) setPal(false);
    if (state.palettePinned && !e.target.closest("#palette")){ state.palettePinned = false; setPal(false); }
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){
      if (state.card){ closeCard(); return; }
      if (pal.open){ state.palettePinned = false; setPal(false); document.getElementById("palMain").focus(); return; }
      if (state.notes){ state.notes = false; render(); return; }
      if (state.area){ go({ area:null }); return; }
    }
    if (state.card && (e.key === "ArrowRight" || e.key === "ArrowLeft")){ e.preventDefault(); step(e.key === "ArrowRight" ? 1 : -1); return; }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".row[data-open]")){ e.preventDefault(); openCard(e.target.dataset.open, e.target.dataset.list); }
  });
  document.getElementById("desk").addEventListener("scroll", onScroll, { passive:true });
}
function onScroll(){
  var row = document.getElementById("chiprow"); if (!row) return;
  var desk = document.getElementById("desk");
  row.classList.toggle("stuck", row.getBoundingClientRect().top - desk.getBoundingClientRect().top <= 0.5 && desk.scrollTop > 0);
}

// ——— Boot ———
renderNotes();
bind();
bindPalette();
var start = (location.hash || "").replace("#", "");
scene(SCENES[start] ? start : "overview");
})();
</script>
